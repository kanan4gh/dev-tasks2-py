[project]
name = "dev-tasks2-py"
version = "0.10.0"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "rich",
    "prompt-toolkit",
    "mcp[cli]",
    # ローカル Web GUI（task_web）で直接使う。いずれも mcp[cli] が transitive で
    # 入れているため追加インストールは発生しないが、直接 import する以上ここに
    # 明示する（上流が依存を落としたときに黙って壊れないように）。
    "starlette",
    "uvicorn",
    "sse-starlette",
]

[project.scripts]
task-py = "task_cli.cli.main:app"
task-mcp = "task_mcp.__main__:main"
task-web = "task_web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_cli", "src/task_mcp", "src/task_web"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8",
    "basedpyright>=1.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.x の TestClient は httpx2 を推奨し、httpx だと毎回警告を出す。
    # httpx は mcp[cli] 経由で既に入っており、これのためだけに httpx2 を
    # 開発依存へ足したくないので、この警告だけを黙らせる。
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ruff の既定ルールセットはバージョン間で変わるため明示的に固定する。
# (0.15 系と 0.16 系で既定が異なり、固定しないと品質ゲートの結果が
#  ruff のバージョンだけで変動する)
select = ["E4", "E7", "E9", "F"]

[tool.basedpyright]
include = ["src", "tests", "scripts", ".claude/hooks"]
# フックが scripts/steering_lint.py をimportするための解決パス
extraPaths = ["scripts"]
pythonVersion = "3.12"
# フックをimportlibで動的ロードするテストの reportAny ノイズを避けるため standard とする
typeCheckingMode = "standard"
