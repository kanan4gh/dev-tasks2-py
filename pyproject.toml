[project]
name = "dev-tasks2-py"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "rich",
    "prompt-toolkit",
]

[project.scripts]
task-py = "task_cli.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_cli"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyright",
]
