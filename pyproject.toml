[project]
name = "dev-tasks2-py"
version = "0.8.3"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "rich",
    "prompt-toolkit",
    "mcp[cli]",
]

[project.scripts]
task-py = "task_cli.cli.main:app"
task-mcp = "task_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_cli", "src/task_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8",
    "basedpyright>=1.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ruff の既定ルールセットはバージョン間で変わるため明示的に固定する。
# (0.15 系と 0.16 系で既定が異なり、固定しないと品質ゲートの結果が
#  ruff のバージョンだけで変動する)
select = ["E4", "E7", "E9", "F"]

[tool.basedpyright]
include = ["src", "tests", "scripts", ".claude/hooks"]
# フックが scripts/steering_lint.py をimportするための解決パス
extraPaths = ["scripts"]
pythonVersion = "3.12"
# フックをimportlibで動的ロードするテストの reportAny ノイズを避けるため standard とする
typeCheckingMode = "standard"
