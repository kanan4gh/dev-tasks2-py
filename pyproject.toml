[project]
name = "dev-tasks2-py"
version = "0.8.2"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "rich",
    "prompt-toolkit",
    "mcp[cli]",
]

[project.scripts]
task-py = "task_cli.cli.main:app"
task-mcp = "task_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_cli", "src/task_mcp"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyright",
]
